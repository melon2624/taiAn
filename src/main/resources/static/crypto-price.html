<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰安資產 - 加密貨幣價格</title>
    <link rel="stylesheet" href="/css/crypto-price.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">T</div>
            <span class="logo-text">泰安資產</span>
        </div>

        <!-- 左側：價格顯示區域 -->
        <div class="left-section">
            <div class="price-labels">
                <div class="label label-symbol">幣種</div>
                <div class="label label-sell">SELL 賣</div>
                <div class="label label-buy">BUY 買</div>
            </div>

            <div class="price-list" id="priceList">
                <div class="loading">
                    <span class="spinner"></span>
                    <span>正在加載價格數據...</span>
                </div>
            </div>

            <button class="refresh-btn" onclick="fetchPrices()">刷新價格</button>
            <div class="update-time" id="updateTime"></div>
        </div>

        <!-- 右側：營業時間 + 聯絡我們 -->
        <div class="info-section">
            <!-- 營業時間 -->
            <div class="business-hours-block">
                <h2 class="info-title">營業時間</h2>
                <p class="info-subtitle">BUSINESS HOURS</p>

                <div class="hours-item">
                    <div class="hours-day">星期一至星期五</div>
                    <div class="hours-time">12:00 - 19:30</div>
                </div>

                <div class="hours-item">
                    <div class="hours-day">星期六</div>
                    <div class="hours-time">12:00 - 19:00</div>
                </div>

                <div class="hours-item hours-closed">
                    <div class="hours-day">星期日</div>
                    <div class="hours-time hours-rest">休息</div>
                </div>
            </div>

            <!-- 聯絡我們 -->
            <div class="contact-block">
                <h2 class="info-title">聯絡我們</h2>
                <p class="info-subtitle">CONTACT US</p>

                <div class="qr-grid">
                    <div class="qr-item">
                        <img src="/img/whatsapp.jpg" alt="WhatsApp QR Code" class="qr-img">
                        <span class="qr-label">WHATSAPP</span>
                    </div>
                    <div class="qr-item">
                        <img src="/img/wechat.jpg" alt="WeChat QR Code" class="qr-img">
                        <span class="qr-label">WECHAT<br><small>微信</small></span>
                    </div>
                    <div class="qr-item">
                        <img src="/img/telegram.jpg" alt="Telegram QR Code" class="qr-img">
                        <span class="qr-label">TELEGRAM</span>
                    </div>
                </div>

                <div class="phone-line">
                    <span class="phone-icon">📱</span>
                    <span class="phone-text">電話(WhatsApp): +852 63782555</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/crypto-price.js"></script>
</body>
</html>
