<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 6 · 后台布局</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/learn/css/custom.css" rel="stylesheet">
</head>
<body>
  <div class="learn-banner">Day 6 · 侧边栏 + 表格 · 自定义 CSS 见 custom.css</div>
  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-2 d-none d-md-block sidebar p-0">
        <div class="brand">CloudNote Admin</div>
        <a href="#" class="active">概览</a>
        <a href="/learn/final/pricing.html">价格</a>
        <a href="/learn/index.html">学习中心</a>
      </aside>
      <main class="col-md-10 p-4">
        <h1 class="h3 mb-4">数据概览</h1>
        <div class="row g-3 mb-4">
          <div class="col-md-4"><div class="card"><div class="card-body"><p class="text-muted mb-1">今日访问</p><p class="stat-value">1,280</p></div></div></div>
          <div class="col-md-4"><div class="card"><div class="card-body"><p class="text-muted mb-1">注册用户</p><p class="stat-value">356</p></div></div></div>
          <div class="col-md-4"><div class="card"><div class="card-body"><p class="text-muted mb-1">收入</p><p class="stat-value">¥8,900</p></div></div></div>
        </div>
        <h2 class="h5">用户列表</h2>
        <table class="table table-striped table-hover">
          <thead><tr><th>ID</th><th>用户名</th><th>状态</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>张三</td><td><span class="badge bg-success">正常</span></td></tr>
            <tr><td>2</td><td>李四</td><td><span class="badge bg-warning">待审</span></td></tr>
            <tr><td>3</td><td>王五</td><td><span class="badge bg-secondary">停用</span></td></tr>
          </tbody>
        </table>
        <p class="text-muted small">TODO: 再加 2 行数据；尝试改 sidebar 背景色</p>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
